name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dd-ltx25-motion:latest
            ghcr.io/${{ github.repository_owner }}/dd-ltx25-motion:${{ github.sha }}
      - name: Try to make package public
        continue-on-error: true
        run: |
          gh api --method PATCH "/user/packages/container/dd-ltx25-motion" -f visibility=public || echo "visibility flip needs a manual click"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
